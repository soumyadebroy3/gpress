[package]
name = "gpress"
version = "0.1.0"
edition = "2021"
publish = false
license = "UNLICENSED"
description = "Lossless PDF compression: smaller PDFs that any reader opens, and the gpress archive that restores byte for byte."
repository = "https://github.com/soumyadebroy3/gpress"

[lib]
path = "src/lib.rs"

[[bin]]
name = "gpress"
path = "src/bin/gpress.rs"

# Our own code has no dependencies. The "existing" feature adds the best existing libraries as extra
# candidates (the engine keeps whichever result is smaller after the checks).
[dependencies]
preflate-rs = { version = "0.7", optional = true }
lepton_jpeg = { version = "0.5", optional = true }

[features]
existing = ["dep:preflate-rs", "dep:lepton_jpeg"]

[workspace]
members = [".", "crates/gpress-c", "crates/gpress-wasm"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
debug = false

[profile.dev]
opt-level = 1
