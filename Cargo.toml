[package]
name = "gpress"
version = "0.1.0"
edition = "2021"
publish = false
license = "UNLICENSED"
description = "Lossless PDF compression: smaller PDFs that any reader opens, and the gpress archive that restores byte for byte."
repository = "https://github.com/soumyadebroy3/gpress"

[lib]
path = "src/lib.rs"

[[bin]]
name = "gpress"
path = "src/bin/gpress.rs"

# A test file that uses a part a build may leave out (see [features]) says so itself, with `#![cfg(...)]` for a
# file whose every test needs the part and `#[cfg(...)]` on each test otherwise; tests/features.rs checks each
# part's absence. Not with required-features here: CI runs the integration tests with `--test '*'`, which
# refuses such a target in a build without its features (bench/check_test_split.py). The example is only
# built, and `--examples` leaves it out of a build without the archive.
[[example]]
name = "type1_fonts"
required-features = ["archive"]

# Our compression code has no dependencies. The "existing" feature adds one existing library, Lepton for JPEG
# streams, as an extra candidate (the engine keeps whichever result is smaller after the checks). Every
# dependency is MIT or Apache-2.0; deny.toml holds the licence rule and `cargo deny` checks it.
[dependencies]
# The AES block cipher, MD5 and SHA-2 for encrypted PDFs (RustCrypto, MIT or Apache-2.0), with "encryption".
aes = { version = "0.9", optional = true }
md-5 = { version = "0.11", optional = true }
sha2 = { version = "0.11", optional = true }
lepton_jpeg = { version = "0.5", optional = true }

# The parts of the engine a product can leave out. All but "existing" are on by default, so a plain build has
# everything; `--no-default-features --features ...` builds only what is named. With a part left out its code
# is not compiled, and a call that needs it returns `Error::NeedsFeature` (see `src/feature.rs`).
[features]
default = ["archive", "jpeg", "fax", "encryption"]
# The gpress archive: compress and expand, the context-mixing model, and the exact re-creation of zlib streams.
archive = []
# Normal PDF: JPEG images get optimal Huffman tables.
jpeg = []
# CCITT fax images: written as JBIG2 in a normal PDF, stored as their pixels in the archive.
fax = []
# Encrypted PDFs the empty password opens: rewritten with the same encryption, or stored decrypted in the
# archive. Without it they are left untouched (normal PDF) or stored as they are (archive).
encryption = ["dep:aes", "dep:md-5", "dep:sha2"]
# Lepton for JPEG streams, which only the archive uses.
existing = ["archive", "dep:lepton_jpeg"]
# The web compressor's build: everything a normal PDF uses, so its output is the native tool's; no archive.
web = ["jpeg", "fax", "encryption"]

[workspace]
members = [".", "crates/gpress-c", "crates/gpress-wasm"]
# fuzz/ is its own package (cargo-fuzz, nightly); it depends on this crate by path.
exclude = ["fuzz"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
debug = false

# The WebAssembly module (`cargo build --profile wasm -p gpress-wasm --target wasm32-unknown-unknown`, which the
# npm package's build runs before wasm-opt): opt-level 3 like the native tool, with what makes the module smaller
# at no cost in speed (panic = "abort", symbols stripped). The size levels cost too much speed (the brief allows
# 10%, docs/tasks/lightweight.md, L2): "s" makes the module 19% smaller in gzip but 8%, 22% and 26% slower in
# Node on the 30-file sample at efforts 0, 50 and 100, and "z" 28% smaller but 1.8 to 1.9 times slower. The
# measurements are in bench/RESULTS.md, "Lightweight".
[profile.wasm]
inherits = "release"
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1
