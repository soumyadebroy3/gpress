[package]
name = "engine"
version = "0.1.0"
edition = "2021"
publish = false
description = "Our own PDF compression engine: Flate encoder and decoder, PDF reader and writer, and the peyaji format."

[lib]
path = "src/lib.rs"

[[bin]]
name = "pdfe"
path = "src/bin/pdfe.rs"

# Our own code has no dependencies. The "existing" feature adds the best existing libraries as extra
# candidates (the engine keeps whichever result is smaller after the checks).
[dependencies]
preflate-rs = { version = "0.7", optional = true }

[features]
existing = ["dep:preflate-rs"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
debug = false

[profile.dev]
opt-level = 1
