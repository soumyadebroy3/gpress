name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
  # Weekly as well, so that new queries and newly found kinds of flaw reach code that has not changed.
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# GitHub's code scanning on our own code: the Rust engine and bindings, the TypeScript wrapper and the npm
# package's scripts, the Python benchmark and check scripts, and the workflows. None of them needs a build.
# The results are on the repository's Security tab, and a pull request that adds an alert gets it on its diff.
jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      # Temporary diagnostic: report every result, not only those on the pull request's changed lines.
      CODEQL_ACTION_DIFF_INFORMED_QUERIES: false
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, python, rust]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
      # Temporary diagnostic: print every result with its rule's security severity, for a session that cannot read alerts.
      - name: List the results
        run: |
          jq -r '.runs[] | . as $run | .results[] |
            (.rule.toolComponent.index // null) as $c | (.rule.index // .ruleIndex) as $i |
            (try (if $c == null then $run.tool.driver.rules[$i] else $run.tool.extensions[$c].rules[$i] end) catch null) as $r |
            [.ruleId, ($r.properties["security-severity"] // "-"), ($r.properties["problem.severity"] // .level // "-"),
             .locations[0].physicalLocation.artifactLocation.uri, (.locations[0].physicalLocation.region.startLine|tostring),
             (.message.text | gsub("\\s+"; " ") | .[0:220])] | @tsv' ../results/*.sarif
