name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels that pull request's run still in progress, since only its latest commit is
# merged. Each push to main has a group of its own, so none of main's runs waits for or cancels another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# A runner has two cores, so the checks are spread over jobs that run at the same time: the test suites by feature
# set and by target, and the fuzzing by decoder. Every command and every test of the one job before is still run.
jobs:
  lint:
    name: Format, clippy and the C example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy --workspace --all-targets --features existing -- -D warnings
      - name: C example against the shared library
        run: |
          cargo build --release -p gpress-c
          gcc -O2 -Wall -Wextra -Icrates/gpress-c/include crates/gpress-c/examples/roundtrip.c -Ltarget/release -lgpress_c -lpthread -ldl -lm -o roundtrip
          printf '%%PDF-1.4\n%%%%EOF\n' > t.pdf
          LD_LIBRARY_PATH=target/release ./roundtrip t.pdf

  # `cargo test --release --workspace` for each feature set below, in two halves that each build only what they
  # run. Together they are what it runs: the libraries' unit tests and their doc tests in one; the binary's unit
  # tests, every integration test (`--test '*'`, with the binary they call) and the examples, which `cargo test`
  # only builds, in the other. bench/check_test_split.py fails when a target's settings would make the halves
  # differ from `cargo test`, and a part with no commands fails too: a manifest change or a renamed part can't drop
  # tests unnoticed. A change to the commands below has to keep them the same as `cargo test` by itself.
  test:
    name: Tests, ${{ matrix.features }} features (${{ matrix.part }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: [default, existing, none, web, all but jpeg, all but fax, all but encryption]
        part: [library and doc tests, integration tests]
        # Each set's cargo flags. Besides every part (default) and Lepton (existing): builds that leave parts of the
        # engine out (Cargo.toml, [features]), which also get clippy here (the lint job runs it on the first two):
        # none of them, the web module's set, and every part but one. Every part but the archive is the web set, so
        # it is not run twice.
        include:
          - features: default
            flags: ''
          - features: existing
            flags: --features existing
          - features: none
            flags: --no-default-features
            clippy: true
          - features: web
            flags: --no-default-features --features web
            clippy: true
          - features: all but jpeg
            flags: --no-default-features --features archive,fax,encryption
            clippy: true
          - features: all but fax
            flags: --no-default-features --features archive,jpeg,encryption
            clippy: true
          - features: all but encryption
            flags: --no-default-features --features archive,jpeg,fax
            clippy: true
    env:
      FLAGS: ${{ matrix.flags }}
      PART: ${{ matrix.part }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.features }}-${{ matrix.part }}
      - run: python3 -I bench/check_test_split.py
      # Clippy on the sets the lint job does not check, in the half that builds less.
      - if: matrix.clippy && matrix.part == 'library and doc tests'
        run: |
          read -ra flags <<< "$FLAGS"
          cargo clippy --workspace --all-targets "${flags[@]}" -- -D warnings
      - run: |
          read -ra flags <<< "$FLAGS"
          case "$PART" in
            'library and doc tests')
              cargo test --release --workspace --lib "${flags[@]}"
              cargo test --release --workspace --doc "${flags[@]}" ;;
            'integration tests')
              cargo test --release --workspace --bins --test '*' "${flags[@]}"
              cargo build --release --workspace --examples "${flags[@]}" ;;
            *)
              echo "no commands for the part '$PART'" >&2
              exit 1 ;;
          esac

  licences:
    name: Licence and advisory gate (cargo deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-deny --locked
      # deny.toml: only the permissive licences on its allow list may appear anywhere in the dependency
      # tree (every feature, every target); known advisories, wildcard versions and unknown registries or
      # git sources fail the job too (all four checks).
      - run: cargo deny check
      # cargo-deny skips crates marked `publish = false` (deny.toml `private.ignore`, for our own crates),
      # so a path or git dependency marked that way would escape it: every dependency must come from crates.io.
      - run: python3 -I bench/check_dep_sources.py

  wasm:
    name: WebAssembly package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # binaryen's wasm-opt: the package build runs it on the module when it is on PATH, and the size check
      # below fails without it (the module would not be the package's).
      - run: sudo apt-get update && sudo apt-get install -y binaryen
      # Both modules: dist/gpress.wasm (every part) and dist/gpress-web.wasm (the "web" feature set).
      - id: build
        working-directory: crates/gpress-wasm/js
        run: |
          npm ci
          npm run build
      # The start-up test prints its median and the distance to the 50 ms target (bench/RESULTS.md, Start-up).
      - working-directory: crates/gpress-wasm/js
        run: npm test
      # The same tests on the web module; the archive tests check that it says it needs the archive.
      - if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: crates/gpress-wasm/js
        run: npm run test:web
      # The size budget, whenever the package built: fails when the web module's gzip size is more than 5% over
      # bench/sizes.json, or over the 400 KB target. A wanted growth is recorded with `bench/sizes.py measure`;
      # so is a module more than 5% under the record, which gets a warning on the run.
      - if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python3 -I bench/sizes.py check
      - uses: actions/upload-artifact@v4
        with:
          name: gpress-wasm
          path: crates/gpress-wasm/js/dist/

  fuzz:
    name: Fuzz the decoders (short run, ${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [expand, inflate, pdf_optimize]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz --locked
      - env:
          FUZZ_TARGET: ${{ matrix.target }}
        run: cargo fuzz run "$FUZZ_TARGET" -- -max_total_time=120 -rss_limit_mb=2048
