name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Build and test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy --workspace --all-targets --features existing -- -D warnings
      - run: cargo test --release --workspace
      - run: cargo test --release --workspace --features existing
      - name: C example against the shared library
        run: |
          cargo build --release -p gpress-c
          gcc -O2 -Wall -Wextra -Icrates/gpress-c/include crates/gpress-c/examples/roundtrip.c -Ltarget/release -lgpress_c -lpthread -ldl -lm -o roundtrip
          printf '%%PDF-1.4\n%%%%EOF\n' > t.pdf
          LD_LIBRARY_PATH=target/release ./roundtrip t.pdf

  licences:
    name: Licence and advisory gate (cargo deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-deny --locked
      # deny.toml: only the permissive licences on its allow list may appear anywhere in the dependency
      # tree (every feature, every target); known advisories, wildcard versions and unknown registries or
      # git sources fail the job too (all four checks).
      - run: cargo deny check
      # cargo-deny skips crates marked `publish = false` (deny.toml `private.ignore`, for our own crates),
      # so a path or git dependency marked that way would escape it: every dependency must come from crates.io.
      - run: python3 -I bench/check_dep_sources.py

  wasm:
    name: WebAssembly package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # binaryen's wasm-opt: the package build runs it on the module when it is on PATH.
      - run: sudo apt-get update && sudo apt-get install -y binaryen
      - id: build
        working-directory: crates/gpress-wasm/js
        run: |
          npm ci
          npm run build
      - working-directory: crates/gpress-wasm/js
        run: npm test
      # The size budget, whenever the package built: fails when the web module's gzip size is more than 5% over
      # bench/sizes.json, or over the 400 KB target. A wanted growth is recorded with `bench/sizes.py measure`.
      - if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python3 -I bench/sizes.py check
      - uses: actions/upload-artifact@v4
        with:
          name: gpress-wasm
          path: crates/gpress-wasm/js/dist/

  fuzz:
    name: Fuzz the decoders (short run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz --locked
      - run: |
          for t in expand inflate pdf_optimize; do
            cargo fuzz run $t -- -max_total_time=120 -rss_limit_mb=2048
          done
