name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A runner has two cores, so the checks are spread over jobs that run at the same time: the test suites by feature
# set and by target, and the fuzzing by decoder. Every command and every test of the one job before is still run.
jobs:
  lint:
    name: Format, clippy and the C example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy --workspace --all-targets --features existing -- -D warnings
      - name: C example against the shared library
        run: |
          cargo build --release -p gpress-c
          gcc -O2 -Wall -Wextra -Icrates/gpress-c/include crates/gpress-c/examples/roundtrip.c -Ltarget/release -lgpress_c -lpthread -ldl -lm -o roundtrip
          printf '%%PDF-1.4\n%%%%EOF\n' > t.pdf
          LD_LIBRARY_PATH=target/release ./roundtrip t.pdf

  # `cargo test --release --workspace` (and the same with `--features existing`) in two halves that each build only
  # what they run. Together they are what it runs: the libraries' unit tests and their doc tests in one; the
  # binary's unit tests, every integration test (`--test '*'`, with the binary they call) and the examples, which
  # `cargo test` only builds, in the other. bench/check_test_split.py fails when a target's settings would make the
  # halves differ from `cargo test`, and a part with no commands fails too, so no test can drop out unnoticed.
  test:
    name: Tests, ${{ matrix.features }} features (${{ matrix.part }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: [default, existing]
        part: [library and doc tests, integration tests]
        include:
          - features: default
            flags: ''
          - features: existing
            flags: --features existing
    env:
      FLAGS: ${{ matrix.flags }}
      PART: ${{ matrix.part }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.features }}-${{ matrix.part }}
      - run: python3 -I bench/check_test_split.py
      - run: |
          read -ra flags <<< "$FLAGS"
          case "$PART" in
            'library and doc tests')
              cargo test --release --workspace --lib "${flags[@]}"
              cargo test --release --workspace --doc "${flags[@]}" ;;
            'integration tests')
              cargo test --release --workspace --bins --test '*' "${flags[@]}"
              cargo build --release --workspace --examples "${flags[@]}" ;;
            *)
              echo "no commands for the part '$PART'" >&2
              exit 1 ;;
          esac

  licences:
    name: Licence and advisory gate (cargo deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-deny --locked
      # deny.toml: only the permissive licences on its allow list may appear anywhere in the dependency
      # tree (every feature, every target); known advisories, wildcard versions and unknown registries or
      # git sources fail the job too (all four checks).
      - run: cargo deny check
      # cargo-deny skips crates marked `publish = false` (deny.toml `private.ignore`, for our own crates),
      # so a path or git dependency marked that way would escape it: every dependency must come from crates.io.
      - run: python3 -I bench/check_dep_sources.py

  wasm:
    name: WebAssembly package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo build --release -p gpress-wasm --target wasm32-unknown-unknown
      - working-directory: crates/gpress-wasm/js
        run: |
          npm ci
          mkdir -p dist && cp ../../../target/wasm32-unknown-unknown/release/gpress_wasm.wasm dist/gpress.wasm
          npm run build:js
          npm test
      - uses: actions/upload-artifact@v4
        with:
          name: gpress-wasm
          path: crates/gpress-wasm/js/dist/

  fuzz:
    name: Fuzz the decoders (short run, ${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [expand, inflate, pdf_optimize]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz --locked
      - env:
          FUZZ_TARGET: ${{ matrix.target }}
        run: cargo fuzz run "$FUZZ_TARGET" -- -max_total_time=120 -rss_limit_mb=2048
