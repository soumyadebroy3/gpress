name: Pages
# The demo page (web/) on GitHub Pages. Only by hand for now: Pages is not switched on for the repository, and
# a deploy that fails on every push would turn main red. To switch it on: Settings, Pages, Source: GitHub
# Actions; then run this workflow from the Actions tab.
on:
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time: a run that has started is left to finish.
concurrency:
  group: pages

jobs:
  build:
    name: Build the page
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      # binaryen's wasm-opt, which the package build runs on the modules (as CI's WebAssembly job does).
      - run: sudo apt-get update && sudo apt-get install -y binaryen
      - working-directory: crates/gpress-wasm/js
        run: |
          npm ci
          npm run build
      # The page's own files with the package's wrapper and web module beside them: all the site is.
      - run: node web/build.mjs _site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write # to deploy the site
      id-token: write # to prove to Pages that the deploy comes from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
