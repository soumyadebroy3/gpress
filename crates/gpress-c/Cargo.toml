[package]
name = "gpress-c"
version = "0.1.0"
edition = "2021"
publish = false
license = "UNLICENSED"
description = "C API for gpress (shared and static library plus include/gpress.h)."

[lib]
name = "gpress_c"
crate-type = ["cdylib", "staticlib"]

[dependencies]
gpress = { path = "../..", default-features = false }

# The parts of the engine, as in gpress's Cargo.toml: all but "existing" on by default, so a plain build is the
# whole library. A part left out returns GPRESS_ERR_NEEDS_FEATURE from the calls that need it.
[features]
default = ["archive", "jpeg", "fax", "encryption"]
archive = ["gpress/archive"]
jpeg = ["gpress/jpeg"]
fax = ["gpress/fax"]
encryption = ["gpress/encryption"]
existing = ["archive", "gpress/existing"]
web = ["jpeg", "fax", "encryption", "gpress/web"]
